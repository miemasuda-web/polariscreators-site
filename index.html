<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>未読 | 自由調査型ミステリー</title>
<meta name="description" content="スマホの中を自由に調べて、人間関係の嘘を暴く。自由調査型ミステリー『未読』。">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@800&display=swap">
<style>
  :root {
    --paper: #f2f1ee; --ink: #1d1c22; --sub: #5d5b63; --rule: #dcd9d2; --unread: #e0284a;
    --mincho: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --sans: "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #15141a; --ink: #eceaf1; --sub: #a9a6b2; --rule: #33313a; --unread: #ff5a75; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); line-height: 1.8; }
  main { max-width: 560px; margin: 0 auto; padding: 72px max(20px, env(safe-area-inset-right, 0px)) 56px max(20px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 36px; }
  .mark { display: flex; justify-content: center; }
  h1 { position: relative; margin: 0; font-family: var(--mincho); font-weight: 800; font-size: 88px; line-height: 1; writing-mode: vertical-rl; letter-spacing: .08em; }
  h1::after { content: ""; position: absolute; top: -8px; right: -18px; width: 16px; height: 16px; border-radius: 50%; background: var(--unread); }
  .lead { margin: 0; text-align: center; font-size: 17px; }
  .store { align-self: center; display: inline-block; padding: 12px 22px; border-radius: 12px; background: var(--ink); color: var(--paper); text-decoration: none; font-weight: 700; }
  .store:focus-visible, a:focus-visible { outline: 2px solid var(--unread); outline-offset: 3px; }
  dl { margin: 0; display: grid; grid-template-columns: 7em 1fr; gap: 10px 12px; border-top: 1px solid var(--rule); padding-top: 24px; font-size: 14px; }
  dt { color: var(--sub); }
  dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  a { color: inherit; }
  footer { font-size: 12px; color: var(--sub); text-align: center; }
</style>
</head>
<body>
<main>
  <div class="mark"><h1>未読</h1></div>
  <p class="lead">スマホの中を自由に調べて、人間関係の嘘を暴く。<br>自由調査型ミステリー。</p>
  <a class="store" href="https://apps.apple.com/jp/app/%E6%9C%AA%E8%AA%AD/id6824348163">App Store で見る</a>
  <dl>
    <dt>対応端末</dt><dd>iPhone（iOS 15 以上）</dd>
    <dt>販売元</dt><dd>MONOBAZU, K.K.</dd>
    <dt>サポート</dt><dd><a href="https://sites.google.com/polariscreators.com/midoku">サポートページ</a></dd>
    <dt>お問い合わせ</dt><dd>midoku.support@gmail.com</dd>
    <dt>プライバシー</dt><dd><a href="https://sites.google.com/polariscreators.com/midoku/%E3%83%97%E3%83%A9%E3%82%A4%E3%83%90%E3%82%B7%E3%83%BC%E3%83%9D%E3%83%AA%E3%82%B7%E3%83%BC">プライバシーポリシー</a></dd>
  </dl>
  <footer>polariscreators.com</footer>
</main>
</body>
</html>
